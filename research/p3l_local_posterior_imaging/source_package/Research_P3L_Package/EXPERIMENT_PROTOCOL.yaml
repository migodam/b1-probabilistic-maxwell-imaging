model_contract:
  execution_authorized: false
  model_id: "P1_TM24_original_prior_noise_acquisition"
  state_equation: "2D scalar TM/VIE"
  grid_shape: [24, 24]
  number_of_grid_cells: 576
  roi_cell_count: 256
  roi_definition: "r <= 0.38"
  number_of_illuminations: 8
  number_of_complex_receivers_per_illumination: 32
  complex_measurement_dimension: 256
  real_measurement_dimension: 512
  gain: 1.0
  host_susceptibility:
    real: 0.1
    imaginary: 0.04
  latent:
    gaussian_dimension: 64
    gaussian_mean: 0.0
    gaussian_covariance: "I_64"
    uniform_dimension: 2
    uniform_support_each: [0.0, 1.0]
    total_dimension: 66
  properties:
    A: "0.8 + u_1"
    B: "0.03 + 0.15 * u_2"
  material_law: "chi = chi_b + phi(z) * (A + i B)"
  fraction_decoder:
    smoothness: "C2,1; piecewise polynomial"
    lower_field_threshold: -0.5
    upper_field_threshold: 0.5
    transition_polynomial: "0.5 + 15*f/8 - 5*f^3 + 6*f^5"
    left_saturation: 0.0
    right_saturation: 1.0
  noise:
    distribution: "circular complex Gaussian"
    complex_channel_variance: "sigma^2"
    real_or_imaginary_variance: "sigma^2 / 2"
    sigma: 0.00119211798514519
    per_parent_snr_renormalization: false
    real_whitening_scale: "sqrt(2) / sigma"
    negative_log_likelihood: "0.5 * norm(real_whitened_residual)^2"
    equivalent_complex_expression: "norm(F(g(q)) - y)^2 / sigma^2"
  prior_reference_measure: "dz du"
  prior_density: "(2*pi)^(-32) * exp(-norm(z)^2/2) * indicator(u in [0,1]^2)"
  multiply_material_gram_determinant_into_prior: false
  noise_ball_as_implicit_posterior_support: false
  reference_prior_material_mean:
    roi: {real: 0.75, imaginary: 0.0925}
    outside_roi: {real: 0.1, imaginary: 0.04}
    requires_new_maxwell: false

target_contract:
  execution_authorized: false
  report_target_families:
    FULL:
      meaning: "Original prior times original Maxwell likelihood."
      hard_local_truncation: false
    LOCAL_C:
      meaning: "Original posterior conditioned on a frozen, y-defined local region C_y."
      local_region_definition_required: true
      unknown_escape_mass_label: "LOCAL_ONLY_ESCAPE_MASS_UNKNOWN"
      full_posterior_coverage_claim_without_escape_audit: false
    SLICE_PROFILE:
      meaning: "Artificial restricted law; exact subtype must be recorded."
      subtypes: [SLICE, PROFILE]
      may_be_reported_as_original_weak_marginal: false
  every_result_requires_fields:
    - target_family
    - target_subtype_if_applicable
    - strong_direction_treatment
    - reference_measure
    - local_region_id_if_applicable
    - approximation_status
  strong_direction_treatments:
    - fixed
    - conditional_optimization
    - bayesian_marginalization
    - explicit_joint_sampling
  exactness_labels:
    - EXACT_INVARIANT_KERNEL_NOT_A_MIXING_CERTIFICATE
    - CERTIFIED_DECISION
    - NUMERICAL_REFERENCE_CROSS_CHECKED
    - APPROXIMATE_TARGET
    - HEURISTIC
    - UNQUALIFIED
  weak_coordinate_contract:
    first_implementation: "Euclidean-orthogonal split of the 64 Gaussian coordinates."
    two_uniform_properties: "Keep explicit and count separately."
    gaussian_weak_dimension_symbol: "d"
    default_outer_dimension: "d + 2"
    remaining_gaussian_dimension: "64 - d"
    low_dimensional_outer_is_not_full_marginal_integration: true
    gaussian_decoder_moments_are_exact_only_under_declared_gaussian_reference: true
    full_importance_proposal_requires_normalized_strong_and_property_densities: true
  pseudo_marginal_contract:
    nonnegative_unbiased_normalizer_required_for_outer_target: true
    initialize_at_positive_normalizer: true
    preserve_inner_random_variables_and_current_weight_on_rejection: true
    cv_ratio_observable_requires_strictly_positive_normalizer_almost_surely: true
    alternative_for_possible_zero_weights: "Prove the CV numerator vanishes on zero-normalizer events, or prove the missing conditional integral is zero."
    local_region_truncation_may_create_zero_weight_events: true
    cv_coefficient_must_be_independent_of_its_evaluated_sample: true
    ordinary_reference_ratio_is_assumed_unbiased: false
    cv_ratio_observable_is_a_posterior_sample: false

